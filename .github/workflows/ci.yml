name: CI

on:
  push:
    branches: [master, main, "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests and doctests
        run: pytest tests/test_disordernet_package.py --doctest-modules disordernet -q
      - name: The CLI runs
        run: |
          disordernet --version
          disordernet table
          disordernet capacity --methods 117 --eps 0.0801

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check disordernet
      - run: ruff format --check disordernet

  package:
    name: wheel builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a fresh env and reproduce a paper number
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "
          from disordernet import capacity, unresolvable_comparisons
          assert capacity(0.0583) == 9, 'ImageNet capacity moved'
          assert unresolvable_comparisons(117, 8) == 798, 'count moved'
          print('paper numbers reproduce from the wheel')"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  lean:
    name: Lean development is sorry-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No sorry, no axiom drift
        run: |
          if grep -rn --include=*.lean -E "(^|[^a-zA-Z_])sorry([^a-zA-Z_]|$)" lean/RequestProject; then
            echo "::error::a sorry is present in the formal development"; exit 1
          fi
          echo "no sorry in $(ls lean/RequestProject/*.lean | wc -l) files"
          grep -q "leanprover/lean4:v4.28.0" lean/lean-toolchain
          grep -q 'rev = "v4.28.0"' lean/lakefile.toml
          echo "toolchain and mathlib revision are pinned"
