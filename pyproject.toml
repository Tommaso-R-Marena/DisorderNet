[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disordernet"
version = "1.0.0"
description = "What a benchmark can resolve, and the protocol that resolves more: capacity bounds for noisy-label benchmarks, with machine-checked proofs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Tommaso R. Marena", email = "marena@cua.edu"}]
maintainers = [{name = "Tommaso R. Marena", email = "marena@cua.edu"}]
keywords = [
    "benchmark", "evaluation", "label-noise", "leaderboard", "capacity",
    "intrinsic-disorder", "CAID", "conformal-prediction", "false-discovery-rate",
    "formal-verification", "lean4",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21,<3.0",
    "scipy>=1.9,<2.0",
]

[project.optional-dependencies]
web = ["gradio>=4.44,<6", "huggingface_hub>=0.23,<1.0"]
viz = ["matplotlib>=3.5,<4.0"]
predict = ["torch>=2.0", "fair-esm>=2.0", "scikit-learn>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5", "build>=1.0", "twine>=5.0"]
all = ["disordernet[web,viz,predict,dev]"]

[project.urls]
Homepage = "https://github.com/Tommaso-R-Marena/DisorderNet"
Repository = "https://github.com/Tommaso-R-Marena/DisorderNet"
Issues = "https://github.com/Tommaso-R-Marena/DisorderNet/issues"
"Formal development" = "https://github.com/Tommaso-R-Marena/DisorderNet/tree/master/lean"

[project.scripts]
disordernet = "disordernet.cli:main"

[tool.setuptools]
packages = ["disordernet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --doctest-glob='*.md' -q"

[tool.ruff]
line-length = 88
target-version = "py39"
